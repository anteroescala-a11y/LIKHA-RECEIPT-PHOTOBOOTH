name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy the web app and icon into the Android project
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html css js icons manifest.webmanifest android/app/src/main/assets/www/
          if [ -d media ]; then cp -r media android/app/src/main/assets/www/; else echo "No media folder: the opening animation will be skipped."; fi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build the APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk receipt-photobooth.apk

      - uses: actions/upload-artifact@v4
        with:
          name: receipt-photobooth-apk
          path: receipt-photobooth.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Receipt Photobooth build ${{ github.run_number }}
          files: receipt-photobooth.apk
